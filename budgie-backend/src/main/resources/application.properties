spring.application.name=budgie-backend
spring.config.import=classpath:frontend-paths.properties
spring.messages.basename=messages

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/budgie_database}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.password=${DATASOURCE_PASSWORD}
api.security.token.secret=${TOKEN_SECRET}
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.mail.password=${MAIL_PASSWORD}

# Criação da Tabela
spring.jpa.hibernate.ddl-auto=update

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}
