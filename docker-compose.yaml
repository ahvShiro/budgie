services:
  budgie-backend:
    build:
      context: ./budgie-backend/
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
        required: false
    env_file:
      - .env

  postgres:
    image: postgres:17
    container_name: budgie-database
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${DATASOURCE_DATABASE}
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - "${DATASOURCE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

volumes:
  postgres_data:
