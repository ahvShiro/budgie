services:
  budgie-backend:
    build:
      context: ./budgie-backend/
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - mysql
    env_file:
      - ./budgie-backend/.env

  mysql:
    image: mysql:latest
    container_name: budgie-database
    environment:
      MYSQL_DATABASE: ${DATASOURCE_DATABASE}
      MYSQL_USER: ${DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${DATASOURCE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATASOURCE_ROOT}
    ports:
      - "${DATASOURCE_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - ./budgie-backend/.env


volumes:
  mysql_data: